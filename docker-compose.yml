services:
  outstasher:
    build: .
    image: outstasher:latest
    container_name: outstasher
    environment:
      - TZ=America/Sao_Paulo
      # jobs.db + senha ficam no volume de config (montado abaixo)
      - DB_DIR=/config
      - TMDB_API_KEY=
      # Se o qBittorrent/Jackett rodam na SUA maquina (host), use
      # host.docker.internal no lugar de localhost e descomente o extra_hosts
      # la embaixo (no Docker Desktop ja funciona sem ele).
      - JACKETT_URL=
      - JACKETT_API_KEY=
      - QBIT_URL=
      - QBIT_USER=
      - QBIT_PASS=
      # Destino "Padrao" criado na primeira execucao. E um caminho DENTRO do
      # container: precisa existir via algum mount de volumes.
      - OUTPUT_DIR=/mnt/outer/coldstorage/media/movies
    ports:
      - "8008:8008"

    # --- Aceleracao por HARDWARE ---
    # O app suporta DUAS familias de GPU: Quick Sync (Intel) e NVENC (NVIDIA),
    # ambas para H.264/HEVC/AV1. Use o bloco da sua placa; sem GPU, remova os
    # dois (a deteccao em runtime testa a GPU de verdade e simplesmente nao
    # oferece o encoder se ele nao abrir). Encode em software (CPU) sempre vale.
    #
    # >>> Intel (Quick Sync / QSV — Arc, iGPUs recentes) <<<
    #   - /dev/dri: o device de render/encode (renderD128) + card0.
    #   - group_add: o container precisa pertencer aos grupos donos do device
    #     para ter permissao de acesso. Descubra os GIDs no host com:
    #         getent group render video    # ex.: render:x:992: / video:x:44:
    #     e ponha os NUMEROS abaixo (nomes de grupo nao existem no container).
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "44"    # GID do grupo 'video' no host (ajuste se o seu for diferente)
      - "992"   # GID do grupo 'render' no host (ajuste se o seu for diferente)
    #
    # >>> NVIDIA (NVENC) <<<
    # Troque os dois blocos acima por este. Exige o NVIDIA Container Toolkit
    # instalado no HOST (o driver vem de la, nao da imagem):
    #     https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu, video]   # 'video' e o que libera o NVENC

    volumes:
      # jobs.db (SQLite) + senha persistem fora do container
      - ./outstasher-config:/config
      # Midia: os caminhos DENTRO do container tem que bater com o "caminho
      # local" do destino de torrents e com o path dos destinos do arquivo
      # final, cadastrados na UI (Configuracoes).
      #
      #   <caminho no host>:<caminho dentro do container>
      - /mnt:/mnt/outer

    restart: unless-stopped

    # Descomente se o qBittorrent/Jackett rodam no host (Linux):
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
